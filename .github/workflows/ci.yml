name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-benchmark.txt
      - name: Lint
        run: ruff check app tests benchmarks --exclude benchmarks/runs
      - name: Format check
        run: ruff format --check app tests benchmarks/serving_benchmark.py benchmarks/reference_stack.py benchmarks/generate_report.py
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - name: CPU reference-stack integration check
        run: >-
          python -m benchmarks.reference_stack
          --output-dir "$RUNNER_TEMP/gateway-reference"
          --requests 4 --concurrency 1,4 --replicates 1
      - name: Upload reference-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-reference-evidence
          path: ${{ runner.temp }}/gateway-reference
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llm-gateway:ci .
      - name: Container smoke test
        run: |
          docker run -d --name gw -p 8000:8000 \
            -e LLM_BACKEND=selfhosted -e REDIS_URL=redis://invalid:6379/0 \
            llm-gateway:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "health endpoint responded"; exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"; docker logs gw; exit 1

